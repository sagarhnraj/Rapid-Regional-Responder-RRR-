# Regional Rapid Responder Spring Boot Production Configuration
spring.application.name=regional-responder-backend

# Server Configuration
server.port=${PORT:8080}
server.error.include-stacktrace=never

# Database Configuration (Aiven PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/regional_responder}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Security / JWT Settings
app.jwt.secret=${JWT_SECRET:RegionalRapidResponderSuperSecretKeyForJWTAuthTokenSigning2026Secure!}
app.jwt.expiration-ms=86400000

# System Defaults
app.sos.system-max-radius-meters=1000

# CORS Allowed Origin (Vercel Frontend URL)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,https://regional-responder.vercel.app}
